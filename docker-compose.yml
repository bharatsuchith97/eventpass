# Production stack: Caddy (HTTPS) -> EventPass (API + web) -> PostgreSQL. Copy .env.example to .env first.
# Only Caddy is reachable from outside; the app and the database stay on the internal Docker network.
# To use a managed PostgreSQL (Supabase, Neon, ...) instead of the db container, set DATABASE_URL in .env;
# the db container then simply sits unused.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventpass
      POSTGRES_DB: eventpass
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventpass -d eventpass"]
      interval: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://eventpass:${DB_PASSWORD}@db:5432/eventpass}
      APP_URL: https://${DOMAIN:?set DOMAIN in .env}
      TRUST_PROXY: 1 # Caddy
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # TLS certificates: keep this volume
      - caddy_config:/config
volumes:
  pgdata:
  caddy_data:
  caddy_config:
